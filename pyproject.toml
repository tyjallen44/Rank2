[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rank2"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.44",
    "httpx>=0.27",
    "pandas>=2.2",
    "duckdb>=0.10",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "nltk>=3.8",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
    "openpyxl>=3.1",
    "anthropic>=0.50",
    "rich>=13.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pyspellchecker>=0.8",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-playwright>=0.5",
]
# Optional: the MCP endpoint (PULSE_MCP_ENABLED=1). Kept out of [project.dependencies]
# so `pip install -e .` is unchanged. NOTE: the mcp SDK requires Python >= 3.10,
# while this project's floor is 3.9. The container is python:3.11-slim (Dockerfile),
# so the deployed image satisfies it; a 3.9 developer install simply cannot add this
# extra. That is why the floor above is left alone. The 2.x bound is not cosmetic:
# FastMCP was renamed to MCPServer in mcp 2.0 and the old import path is gone, so an
# open-ended floor would resolve across an incompatible rename.
mcp = [
    "mcp>=2.2,<3",
    "pyjwt[crypto]>=2.9",
]

[tool.hatch.build.targets.wheel]
packages = ["perception", "dashboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["dashboard/tests"]
